<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三重视界 · 月相 日地月 深空黄道</title>
    <style>
        /* ===== 深空渐变背景，继承原风格 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #05051a 0%, #121238 50%, #1e1e48 100%);
            color: #f8f9fa;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            text-align: center;
        }

        h1 {
            margin: 15px 0 5px;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.7);
            font-size: 2.2rem;
        }

        .subtitle {
            color: #ffd700;
            margin-bottom: 20px;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* ========== 上半部分全局控制栏 (控制月相 & 日地月) ========== */
        .global-controls {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 60px;
            padding: 20px 30px;
            margin: 10px auto 30px;
            max-width: 1000px;
            border: 1px solid #ffd70040;
            backdrop-filter: blur(6px);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .date-group {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .date-input {
            padding: 12px 20px;
            font-size: 1.1rem;
            border-radius: 40px;
            border: 2px solid #fff;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            width: 180px;
            text-align: center;
        }

        .date-input:focus {
            outline: none;
            box-shadow: 0 0 12px #ffd700;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 40px;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: #ffd700;
            color: #05051a;
        }

        .btn-primary:hover {
            background: #ffe152;
            box-shadow: 0 0 15px #ffd700;
            transform: scale(1.03);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 2px solid #fff;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.03);
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 2 1 300px;
            min-width: 280px;
        }

        .slider-container span {
            color: #ffd700;
            font-weight: bold;
            min-width: 70px;
            text-align: right;
        }

        .progress-bar {
            -webkit-appearance: none;
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            border: 1px solid #fff;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #ffd700;
            cursor: pointer;
            box-shadow: 0 0 15px #ffd700;
        }

        /* ========== 布局：上排双窗口，下排单窗口 ========== */
        .top-row {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .bottom-row {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .window {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 25px 25px 30px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
        }

        .top-row .window {
            flex: 1 1 550px;  /* 更宽 */
            min-width: 500px;
        }

        .bottom-row .window {
            width: 95%;
            max-width: 1500px;  /* 底部窗口超大 */
        }

        .window-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ffd700;
            font-size: 1.6rem;
            font-weight: bold;
            color: #ffd700;
        }

        .window-header small {
            font-size: 0.9rem;
            color: #aaa;
            font-weight: normal;
        }

        /* 左窗口：月相画布 */
        .moon-circle {
            width: 380px;
            height: 380px;
            border-radius: 50%;
            box-shadow: 0 0 70px rgba(255, 255, 255, 0.7);
            overflow: hidden;
            background: transparent;
            margin: 0 auto;
        }

        .moon-circle canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 右窗口：太空画布 */
        .space-canvas-container {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .space-canvas-container canvas {
            width: 100%;
            max-width: 720px;
            height: auto;
            border-radius: 24px;
            background: transparent;
        }

        /* 信息卡片 (上半部分统一) */
        .info-panel {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 18px;
            margin-top: 20px;
            text-align: left;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .info-title {
            color: #ffd700;
            font-size: 1.3rem;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 10px;
            border-radius: 16px;
        }

        .info-label {
            color: #aaa;
            font-size: 0.8rem;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
        }

        /* ========== 下半部分：深空窗口独立样式 ========== */
        .deepspace-window {
            width: 100%;
        }

        /* 深空画布容器 */
        .deepspace-canvas-container {
            width: 100%;
            height: 500px;        /* 固定高度，增大 */
            border-radius: 28px;
            overflow: hidden;
            background: #00000030;
            margin-bottom: 20px;
        }

        .deepspace-canvas-container canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 深空独立控制面板 (重新设计为 flex 布局，非绝对定位) */
        .deepspace-controls {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 20px 30px;
            border: 1px solid #ffd70060;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-top: 10px;
        }

        .deepspace-info-panel {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 30px;
            padding: 18px 25px;
            border: 1px solid #ffd70060;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 25px;
            margin-bottom: 20px;
        }

        .deepspace-info-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .deepspace-info-item .label {
            color: #ffd700;
            font-weight: bold;
        }

        .deepspace-info-item .value {
            color: #fff;
            background: rgba(255,255,255,0.1);
            padding: 5px 15px;
            border-radius: 40px;
        }

        .deepspace-legend {
            display: flex;
            gap: 20px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }

        .sun-legend { background: #ffdd77; box-shadow: 0 0 12px #ffaa33; }
        .moon-legend { background: #c0c0c0; box-shadow: 0 0 8px #aaa; }

        .deepspace-sliders {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 20px;
            flex: 2;
            min-width: 400px;
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .slider-group label {
            color: #ffd700;
            white-space: nowrap;
        }

        .deepspace-slider {
            -webkit-appearance: none;
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            border: 1px solid #fff;
            flex: 1;
        }

        .deepspace-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #ffd700;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 12px #ffd700;
        }

        .deepspace-buttons {
            display: flex;
            gap: 12px;
        }

        .deepspace-btn {
            padding: 10px 20px;
            border-radius: 40px;
            border: 2px solid #fff;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .deepspace-btn:hover {
            background: #ffd700;
            color: #05051a;
            border-color: #ffd700;
        }

        .deepspace-time {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffd700;
            background: rgba(0,0,0,0.4);
            padding: 8px 25px;
            border-radius: 40px;
        }

        @media (max-width: 1200px) {
            .top-row .window { min-width: 450px; }
            .moon-circle { width: 300px; height: 300px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🌗 三重视界 · 月相 日地月 深空黄道</h1>
    <div class="subtitle">上半部同步控制 · 下半部独立调节 · 太阳右移不挡轨道</div>

    <!-- ========== 上半部分全局控制栏 (控制月相 & 日地月) ========== -->
    <div class="global-controls">
        <div class="date-group">
            <input type="number" class="date-input" id="globalDateInput" placeholder="农历日期" min="1" max="30" step="0.1" value="1">
            <button class="btn btn-primary" id="globalSetBtn">定位</button>
        </div>
        <div class="slider-container">
            <span id="globalSliderValue">1.0</span>
            <input type="range" class="progress-bar" id="globalSlider" min="1" max="30" value="1" step="0.1">
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-secondary" id="globalAutoBtn">自动播放</button>
            <button class="btn btn-secondary" id="globalStopBtn">停止</button>
        </div>
    </div>

    <!-- ========== 上排双窗口 ========== -->
    <div class="top-row">
        <!-- 左窗口：月相（地球视角） -->
        <div class="window left-window">
            <div class="window-header">
                🌖 月相 · 地球视角
                <small>与右侧亮面同步</small>
            </div>
            <div class="moon-circle">
                <canvas id="moonCanvas" width="400" height="400"></canvas>
            </div>
            <div class="info-panel" id="leftInfoPanel">
                <div class="info-title">🌑 新月 · 初一</div>
                <div class="info-grid">
                    <div class="info-item"><div class="info-label">月龄</div><div class="info-value" id="leftMoonAge">0.0 天</div></div>
                    <div class="info-item"><div class="info-label">亮面占比</div><div class="info-value" id="leftBrightRatio">0%</div></div>
                    <div class="info-item"><div class="info-label">可见时段</div><div class="info-value" id="leftVisible">与太阳同升同落</div></div>
                    <div class="info-item"><div class="info-label">日地月夹角</div><div class="info-value" id="leftAngle">0°</div></div>
                </div>
            </div>
        </div>

        <!-- 右窗口：日地月 · 太空俯瞰 (太阳固定在右侧，月球始终右侧亮左侧暗) -->
        <div class="window middle-window">
            <div class="window-header">
                🪐 日地月 · 太空俯瞰
                <small>太阳固定在右侧边缘</small>
            </div>
            <div class="space-canvas-container">
                <canvas id="spaceCanvas" width="720" height="560"></canvas>
            </div>
            <div class="info-panel" id="rightInfoPanel">
                <div class="info-title">🌑 新月 · 初一</div>
                <div class="info-grid">
                    <div class="info-item"><div class="info-label">月相名称</div><div class="info-value" id="rightPhaseName">新月</div></div>
                    <div class="info-item"><div class="info-label">亮面占比</div><div class="info-value" id="rightBrightRatio">0%</div></div>
                    <div class="info-item"><div class="info-label">日地月夹角</div><div class="info-value" id="rightAngle">0°</div></div>
                    <!-- 月球位置项已删除 -->
                </div>
            </div>
        </div>
    </div>

    <!-- ========== 下排单窗口：深空日月视运动（独立控制） ========== -->
    <div class="bottom-row">
        <div class="window deepspace-window">
            <div class="window-header">
                🌌 日月视运动 · 深空 (独立调节)
                <small>黄道45°倾斜 · 方位已标</small>
            </div>
            <!-- 深空画布容器 -->
            <div id="deepspace-canvas-container" class="deepspace-canvas-container"></div>

            <!-- 深空独立信息栏 -->
            <div class="deepspace-info-panel">
                <div class="deepspace-info-item">
                    <span class="label">当前时间</span>
                    <span class="value" id="deepTime">初一 0:00</span>
                </div>
                <div class="deepspace-info-item">
                    <span class="label">太阳位置</span>
                    <span class="value" id="deepSunPos">北边地下</span>
                </div>
                <div class="deepspace-info-item">
                    <span class="label">月亮位置</span>
                    <span class="value" id="deepMoonPos">北边地下</span>
                </div>
                <div class="deepspace-info-item">
                    <span class="label">日月角距</span>
                    <span class="value" id="deepAngle">0°</span>
                </div>
                <div class="deepspace-legend">
                    <div class="legend-item"><span class="legend-color sun-legend"></span>太阳</div>
                    <div class="legend-item"><span class="legend-color moon-legend"></span>月亮</div>
                </div>
            </div>

            <!-- 深空独立控制栏 -->
            <div class="deepspace-controls">
                <div class="slider-group">
                    <label>农历</label>
                    <input type="range" class="deepspace-slider" id="deepDateSlider" min="1" max="30" value="1" step="1">
                </div>
                <div class="slider-group">
                    <label>时刻</label>
                    <input type="range" class="deepspace-slider" id="deepTimeSlider" min="0" max="23" value="0" step="1">
                </div>
                <div class="deepspace-buttons">
                    <button class="deepspace-btn" id="deepPrevBtn">前一天</button>
                    <button class="deepspace-btn" id="deepNextBtn">后一天</button>
                    <button class="deepspace-btn" id="deepPlayBtn">播放</button>
                    <button class="deepspace-btn" id="deepResetBtn">重置</button>
                </div>
                <div class="slider-group">
                    <label>速度</label>
                    <input type="range" class="deepspace-slider" id="deepSpeedControl" min="1" max="10" value="5">
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 引入 Three.js 和 OrbitControls (用于深空) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>

<script>
    // ==================== 上半部分脚本 (控制月相 & 日地月) ====================
    (function() {
        // 全局共享状态
        let currentDate = 1.0;
        let playInterval = null;
        let isPlaying = false;

        const globalDateInput = document.getElementById('globalDateInput');
        const globalSetBtn = document.getElementById('globalSetBtn');
        const globalAutoBtn = document.getElementById('globalAutoBtn');
        const globalStopBtn = document.getElementById('globalStopBtn');
        const globalSlider = document.getElementById('globalSlider');
        const globalSliderValue = document.getElementById('globalSliderValue');

        // 公共天文参数（基于几何）
        const synodicMonth = 29.53;

        function getGeometricParams(date) {
            date = Math.min(30, Math.max(1, parseFloat(date)));
            let rad = (date / 30) * 2 * Math.PI;
            let brightDecimal = (1 - Math.cos(rad)) / 2;
            let brightPercent = brightDecimal * 100;
            if (brightPercent < 0.5) brightPercent = 0;
            if (brightPercent > 99.5) brightPercent = 100;

            let direction = 'full';
            if (brightPercent < 50) {
                direction = (Math.sin(rad) >= 0) ? 'west' : 'east';
            } else if (brightPercent > 50 && brightPercent < 99.9) {
                direction = (Math.sin(rad) >= 0) ? 'west' : 'east';
            } else if (brightPercent <= 0.5) {
                direction = 'none';
            } else {
                direction = 'full';
            }

            let phaseName = '';
            if (brightPercent <= 0.5) phaseName = '新月';
            else if (brightPercent >= 99.5) phaseName = '满月';
            else if (brightPercent > 45 && brightPercent < 55) {
                phaseName = (Math.sin(rad) > 0) ? '上弦月' : '下弦月';
            } else if (brightPercent < 45) {
                phaseName = (Math.sin(rad) > 0) ? '蛾眉月' : '残月';
            } else if (brightPercent > 55) {
                phaseName = (Math.sin(rad) > 0) ? '盈凸月' : '亏凸月';
            }

            let angleDeg = (rad * 180 / Math.PI).toFixed(1);

            let visibleDesc = '';
            let deg = (rad * 180 / Math.PI) % 360;
            if (deg < 22.5 || deg >= 337.5) visibleDesc = '与太阳同升同落';
            else if (deg < 67.5) visibleDesc = '西方低空(上半夜)';
            else if (deg < 112.5) visibleDesc = '正午出子夜落';
            else if (deg < 157.5) visibleDesc = '下午出后半夜落';
            else if (deg < 202.5) visibleDesc = '黄昏出黎明落';
            else if (deg < 247.5) visibleDesc = '晚上出上午落';
            else if (deg < 292.5) visibleDesc = '子夜出正午落';
            else visibleDesc = '凌晨出上午落';

            return { rad, brightPercent, direction, phaseName, angleDeg, visibleDesc };
        }

        // 左模块：月相
        const leftCanvas = document.getElementById('moonCanvas');
        const leftCtx = leftCanvas.getContext('2d');
        const LIGHT_COLOR = '#f0f0f0';
        const DARK_COLOR = '#05051a';

        function drawMoonLeft(brightPercent, direction) {
            const w = leftCanvas.width, h = leftCanvas.height;
            const R = w/2, cx = R, cy = R;
            leftCtx.clearRect(0, 0, w, h);

            if (brightPercent >= 99.9 || direction === 'full') {
                leftCtx.beginPath(); leftCtx.arc(cx, cy, R, 0, 2*Math.PI); leftCtx.fillStyle = LIGHT_COLOR; leftCtx.fill();
                return;
            }
            if (brightPercent <= 0.1 || direction === 'none') {
                leftCtx.beginPath(); leftCtx.arc(cx, cy, R, 0, 2*Math.PI); leftCtx.fillStyle = DARK_COLOR; leftCtx.fill();
                return;
            }

            const p = brightPercent / 100;
            let cosN = 1 - 2 * p;
            cosN = Math.min(1, Math.max(-1, cosN));

            leftCtx.beginPath(); leftCtx.arc(cx, cy, R, 0, 2*Math.PI); leftCtx.fillStyle = LIGHT_COLOR; leftCtx.fill();
            leftCtx.fillStyle = DARK_COLOR;
            leftCtx.beginPath();

            if (direction === 'west' || direction === 'none' || direction === 'full') {
                for (let y = 1; y >= -1; y -= 0.015) {
                    const xLeft = -Math.sqrt(1 - y*y);
                    const canvasX = cx + xLeft * R, canvasY = cy - y * R;
                    if (y === 1) leftCtx.moveTo(canvasX, canvasY); else leftCtx.lineTo(canvasX, canvasY);
                }
                for (let y = -1; y <= 1; y += 0.015) {
                    const xBound = cosN * Math.sqrt(1 - y*y);
                    const canvasX = cx + xBound * R, canvasY = cy - y * R;
                    leftCtx.lineTo(canvasX, canvasY);
                }
            } else if (direction === 'east') {
                for (let y = 1; y >= -1; y -= 0.015) {
                    const xRight = Math.sqrt(1 - y*y);
                    const canvasX = cx + xRight * R, canvasY = cy - y * R;
                    if (y === 1) leftCtx.moveTo(canvasX, canvasY); else leftCtx.lineTo(canvasX, canvasY);
                }
                for (let y = -1; y <= 1; y += 0.015) {
                    const xBound = -cosN * Math.sqrt(1 - y*y);
                    const canvasX = cx + xBound * R, canvasY = cy - y * R;
                    leftCtx.lineTo(canvasX, canvasY);
                }
            }
            leftCtx.closePath(); leftCtx.fill();
        }

        function getLeftPhase(date) {
            const geo = getGeometricParams(date);
            const age = (date - 1) % synodicMonth;
            return { age, brightPercentage: geo.brightPercent, name: geo.phaseName, angle: geo.angleDeg, visible: geo.visibleDesc, direction: geo.direction };
        }

        function updateLeftPanel(date) {
            date = Math.min(30, Math.max(1, parseFloat(date)));
            const phase = getLeftPhase(date);
            drawMoonLeft(phase.brightPercentage, phase.direction);
            document.getElementById('leftMoonAge').innerText = phase.age.toFixed(1) + ' 天';
            document.getElementById('leftBrightRatio').innerText = Math.round(phase.brightPercentage) + '%';
            document.getElementById('leftVisible').innerText = phase.visible;
            document.getElementById('leftAngle').innerText = phase.angle + '°';
            document.querySelector('#leftInfoPanel .info-title').innerHTML = `${phase.name} · 农历${date.toFixed(1)}日`;
        }

        // 右模块：太空俯瞰 (太阳位置已右移，月球使用固定光照：右侧亮左侧暗)
        const rightCanvas = document.getElementById('spaceCanvas');
        const rightCtx = rightCanvas.getContext('2d');
        const w = rightCanvas.width, h = rightCanvas.height;
        const SUN_RADIUS = 45, EARTH_RADIUS = 28, MOON_RADIUS = 16, ORBIT_RADIUS = 200;
        // 太阳位置：向右移动至靠近右边界 (w - 60)，确保不遮挡轨道
        const sunX = w - 60;
        const sunY = h/2 - 10;
        const earthX = w/2, earthY = h/2;
        const SUN_COLOR = '#ffdd77', SUN_GLOW = '#ffaa33', EARTH_COLOR = '#3a6ea5';
        const MOON_LIGHT = '#f0f0f0', MOON_DARK = '#2a2a3a'; // 亮色和暗色
        const STAR_COLOR = 'rgba(255,255,255,0.8)';

        function drawStarsRight() {
            for (let i = 0; i < 150; i++) {
                if (i % 2 === 0) continue;
                const x = (i * 31) % w, y = (i * 17) % h, r = 1 + (i % 3) * 0.5;
                rightCtx.beginPath(); rightCtx.arc(x, y, r, 0, 2*Math.PI); rightCtx.fillStyle = STAR_COLOR; rightCtx.fill();
            }
        }

        function drawSunRight() {
            rightCtx.shadowColor = SUN_GLOW; rightCtx.shadowBlur = 40;
            rightCtx.beginPath(); rightCtx.arc(sunX, sunY, SUN_RADIUS, 0, 2*Math.PI); rightCtx.fillStyle = SUN_COLOR; rightCtx.fill();
            rightCtx.shadowBlur = 30;
            rightCtx.beginPath(); rightCtx.arc(sunX, sunY, SUN_RADIUS-5, 0, 2*Math.PI); rightCtx.fillStyle = '#fff3b0'; rightCtx.fill();
            rightCtx.shadowBlur = 0;
            for (let i = -3; i <= 3; i+=1.5) {
                rightCtx.beginPath(); rightCtx.moveTo(sunX-15, sunY+i*8); rightCtx.lineTo(sunX+70, sunY+i*8+30); rightCtx.strokeStyle = 'rgba(255,240,170,0.2)'; rightCtx.stroke();
            }
        }

        function drawEarthRight() {
            rightCtx.shadowColor = '#00000040'; rightCtx.shadowBlur = 15;
            rightCtx.beginPath(); rightCtx.arc(earthX, earthY, EARTH_RADIUS, 0, 2*Math.PI); rightCtx.fillStyle = EARTH_COLOR; rightCtx.fill();
            rightCtx.shadowBlur = 10;
            rightCtx.beginPath(); rightCtx.arc(earthX-3, earthY-3, EARTH_RADIUS-4, 0, 2*Math.PI); rightCtx.fillStyle = '#7fb4d9'; rightCtx.fill();
            rightCtx.shadowBlur = 0;
            rightCtx.beginPath(); rightCtx.arc(earthX-4, earthY-4, 3, 0, 2*Math.PI); rightCtx.fillStyle = '#ffffff60'; rightCtx.fill();
        }

        // 新月球绘制函数：始终右侧亮左侧暗（固定光照方向）
        function drawMoonPhaseRight(cx, cy, R, brightPercent, direction) {
            // 忽略 brightPercent 和 direction，使用固定光照：右侧亮，左侧暗
            const left = Math.max(0, Math.floor(cx - R));
            const right = Math.min(w, Math.ceil(cx + R));
            const top = Math.max(0, Math.floor(cy - R));
            const bottom = Math.min(h, Math.ceil(cy + R));
            const width = right - left;
            const height = bottom - top;
            if (width <= 0 || height <= 0) return;

            // 获取月球区域的图像数据
            const imageData = rightCtx.getImageData(left, top, width, height);
            const data = imageData.data;

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const canvasX = left + x;
                    const canvasY = top + y;
                    const dx = canvasX - cx;
                    const dy = canvasY - cy;
                    if (dx*dx + dy*dy <= R*R) {
                        const idx = (y * width + x) * 4;
                        if (canvasX > cx) {
                            // 右侧亮面
                            data[idx] = 240; data[idx+1] = 240; data[idx+2] = 240; data[idx+3] = 255;
                        } else {
                            // 左侧暗面
                            data[idx] = 42; data[idx+1] = 42; data[idx+2] = 58; data[idx+3] = 255;
                        }
                    }
                }
            }
            rightCtx.putImageData(imageData, left, top);
        }

        function getRightParams(date) {
            const geo = getGeometricParams(date);
            let rad = geo.rad;
            const moonX = earthX + ORBIT_RADIUS * Math.cos(rad);
            const moonY = earthY - ORBIT_RADIUS * Math.sin(rad);
            return { moonX, moonY, brightPercent: geo.brightPercent, direction: geo.direction, phaseName: geo.phaseName, angleDeg: geo.angleDeg };
        }

        function drawSceneRight(date) {
            rightCtx.clearRect(0, 0, w, h);
            drawStarsRight();
            drawSunRight();
            drawEarthRight();
            rightCtx.strokeStyle = 'rgba(200,220,255,0.25)'; rightCtx.lineWidth = 1.5;
            rightCtx.setLineDash([5, 5]);
            rightCtx.beginPath(); rightCtx.arc(earthX, earthY, ORBIT_RADIUS, 0, 2*Math.PI); rightCtx.stroke();
            rightCtx.setLineDash([]);
            const p = getRightParams(date);
            rightCtx.strokeStyle = 'rgba(255,255,255,0.15)'; rightCtx.lineWidth = 1;
            rightCtx.beginPath(); rightCtx.moveTo(earthX, earthY); rightCtx.lineTo(p.moonX, p.moonY); rightCtx.stroke();
            // 绘制月球（固定光照）
            drawMoonPhaseRight(p.moonX, p.moonY, MOON_RADIUS, p.brightPercent, p.direction);
            return p;
        }

        function updateRightPanel(date) {
            date = Math.min(30, Math.max(1, parseFloat(date)));
            const params = drawSceneRight(date);
            let brightRound = Math.round(params.brightPercent);
            document.getElementById('rightPhaseName').innerText = params.phaseName;
            document.getElementById('rightBrightRatio').innerText = brightRound + '%';
            document.getElementById('rightAngle').innerText = params.angleDeg + '°';
            document.querySelector('#rightInfoPanel .info-title').innerHTML = `${params.phaseName} · 农历${date.toFixed(1)}日`;
        }

        function updateAll(date) {
            date = Math.min(30, Math.max(1, parseFloat(date)));
            currentDate = date;
            globalDateInput.value = date.toFixed(1);
            globalSlider.value = date;
            globalSliderValue.innerText = date.toFixed(1);
            updateLeftPanel(date);
            updateRightPanel(date);
        }

        globalSetBtn.addEventListener('click', () => {
            if (isPlaying) stopAutoPlay();
            updateAll(globalDateInput.value);
        });
        globalSlider.addEventListener('input', (e) => {
            if (isPlaying) stopAutoPlay();
            updateAll(e.target.value);
        });
        globalDateInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') globalSetBtn.click(); });
        function startAutoPlay() {
            if (isPlaying) return;
            isPlaying = true;
            playInterval = setInterval(() => {
                currentDate = currentDate + 0.1;
                if (currentDate > 30) currentDate = 1.0;
                updateAll(currentDate);
            }, 100);
        }
        function stopAutoPlay() { isPlaying = false; clearInterval(playInterval); }
        globalAutoBtn.addEventListener('click', startAutoPlay);
        globalStopBtn.addEventListener('click', stopAutoPlay);

        updateAll(1.0);
    })();

    // ==================== 下半部分脚本：深空日月视运动（独立控制） ====================
    (function() {
        // 获取独立容器
        const canvasContainer = document.getElementById('deepspace-canvas-container');
        let scene, camera, renderer, controls;
        let ground, celestialSphere, ecliptic, sun, moon;
        let currentDate = 1;          // 农历
        let isPlaying = false;
        let animationSpeed = 5;
        let timeOfDay = 0;             // 0-1

        // 获取独立控件
        const deepDateSlider = document.getElementById('deepDateSlider');
        const deepTimeSlider = document.getElementById('deepTimeSlider');
        const deepPrevBtn = document.getElementById('deepPrevBtn');
        const deepNextBtn = document.getElementById('deepNextBtn');
        const deepPlayBtn = document.getElementById('deepPlayBtn');
        const deepResetBtn = document.getElementById('deepResetBtn');
        const deepSpeedControl = document.getElementById('deepSpeedControl');
        const deepTimeDisplay = document.getElementById('deepTime');
        const deepSunPos = document.getElementById('deepSunPos');
        const deepMoonPos = document.getElementById('deepMoonPos');
        const deepAngle = document.getElementById('deepAngle');

        function initDeep() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, canvasContainer.clientWidth / canvasContainer.clientHeight, 0.1, 1000);
            camera.position.set(6, 8, 12);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
            renderer.setClearColor(0x05051a); // 深色背景
            canvasContainer.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.rotateSpeed = 0.5;

            // 光源
            const ambient = new THREE.AmbientLight(0x404060);
            scene.add(ambient);
            const dirLight = new THREE.DirectionalLight(0xffeedd, 1.5);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);
            const backLight = new THREE.PointLight(0x446688, 0.8);
            backLight.position.set(-3, 2, -5);
            scene.add(backLight);

            // 地面
            const groundGeo = new THREE.CircleGeometry(5, 32);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x22aa22, emissive: 0x112211 });
            ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // 方位标记（金色小球）
            addMarkers();
            // 十字坐标
            addCross();

            // 天球
            const sphereGeo = new THREE.SphereGeometry(5, 64, 64);
            const sphereMat = new THREE.MeshPhongMaterial({ color: 0x335588, transparent: true, opacity: 0.15, side: THREE.DoubleSide });
            celestialSphere = new THREE.Mesh(sphereGeo, sphereMat);
            scene.add(celestialSphere);

            // 黄道
            const points = [];
            const inclination = 45 * Math.PI / 180;
            for (let i = 0; i <= 360; i++) {
                const theta = i * Math.PI / 180;
                const x = 5 * Math.cos(theta);
                const y = 5 * Math.sin(theta) * Math.sin(inclination);
                const z = 5 * Math.sin(theta) * Math.cos(inclination);
                points.push(new THREE.Vector3(x, y, z));
            }
            const eclipticGeo = new THREE.BufferGeometry().setFromPoints(points);
            const eclipticMat = new THREE.LineDashedMaterial({ color: 0xff6666, dashSize: 0.2, gapSize: 0.1 });
            ecliptic = new THREE.Line(eclipticGeo, eclipticMat);
            ecliptic.computeLineDistances();
            scene.add(ecliptic);

            // 太阳
            const sunGeo = new THREE.SphereGeometry(0.4, 32);
            const sunMat = new THREE.MeshStandardMaterial({ color: 0xffaa33, emissive: 0x442200 });
            sun = new THREE.Mesh(sunGeo, sunMat);
            scene.add(sun);
            const sunLight = new THREE.PointLight(0xffaa33, 1, 8);
            sun.add(sunLight);

            // 月亮
            const moonGeo = new THREE.SphereGeometry(0.25, 32);
            const moonMat = new THREE.MeshStandardMaterial({ color: 0xc0c0c0, emissive: 0x222222 });
            moon = new THREE.Mesh(moonGeo, moonMat);
            scene.add(moon);

            // 添加方位文字标签（东、西、南、北）
            addDirectionLabels();

            window.addEventListener('resize', onResizeDeep);
            setupDeepControls();
            updateDeepPosition();
            animateDeep();
        }

        function addMarkers() {
            const radius = 5;
            const markerMat = new THREE.MeshStandardMaterial({ color: 0xffd700 });
            const markerGeo = new THREE.SphereGeometry(0.1, 16);
            
            const eastMarker = new THREE.Mesh(markerGeo, markerMat);
            eastMarker.position.set(radius, 0.01, 0);
            scene.add(eastMarker);
            
            const westMarker = new THREE.Mesh(markerGeo, markerMat);
            westMarker.position.set(-radius, 0.01, 0);
            scene.add(westMarker);
            
            const southMarker = new THREE.Mesh(markerGeo, markerMat);
            southMarker.position.set(0, 0.01, radius);
            scene.add(southMarker);
            
            const northMarker = new THREE.Mesh(markerGeo, markerMat);
            northMarker.position.set(0, 0.01, -radius);
            scene.add(northMarker);
        }

        function addCross() {
            const material = new THREE.LineBasicMaterial({ color: 0xffd70080 });
            const pointsEW = [new THREE.Vector3(-5,0.02,0), new THREE.Vector3(5,0.02,0)];
            scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pointsEW), material));
            const pointsNS = [new THREE.Vector3(0,0.02,-5), new THREE.Vector3(0,0.02,5)];
            scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pointsNS), material));
        }

        // 添加方位文字标签（东、西、南、北）
        function addDirectionLabels() {
            const radius = 5;
            const offset = 0.8; // 标签偏离小球的距离
            const yLevel = 0.2;  // 稍微抬高避免与地面重叠

            addTextLabelDeep("东", radius + offset, yLevel, 0, '#ffd700');
            addTextLabelDeep("西", -radius - offset, yLevel, 0, '#ffd700');
            addTextLabelDeep("南", 0, yLevel, radius + offset, '#ffd700');
            addTextLabelDeep("北", 0, yLevel, -radius - offset, '#ffd700');
        }

        // 创建文字标签的Sprite
        function addTextLabelDeep(text, x, y, z, color) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 64;
            canvas.height = 64;
            context.fillStyle = color;
            context.font = 'bold 48px "Microsoft YaHei"';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText(text, 32, 32);
            
            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(material);
            sprite.position.set(x, y, z);
            sprite.scale.set(0.8, 0.8, 0.8);
            scene.add(sprite);
        }

        function updateDeepPosition() {
            const radius = 5;
            const inclination = 45 * Math.PI / 180;
            const initialAngle = -Math.PI / 2;
            const sunAngle = initialAngle + (currentDate - 1 + timeOfDay) * 2 * Math.PI;
            const moonAngle = initialAngle + (currentDate - 1) * 2 * Math.PI * 348/360 + timeOfDay * 2 * Math.PI * 348/360;

            sun.position.x = radius * Math.cos(sunAngle);
            sun.position.y = radius * Math.sin(sunAngle) * Math.sin(inclination);
            sun.position.z = radius * Math.sin(sunAngle) * Math.cos(inclination);

            moon.position.x = radius * Math.cos(moonAngle);
            moon.position.y = radius * Math.sin(moonAngle) * Math.sin(inclination);
            moon.position.z = radius * Math.sin(moonAngle) * Math.cos(inclination);

            // 更新显示
            const hour = Math.floor(timeOfDay * 24);
            const minute = Math.floor((timeOfDay * 24 - hour) * 60);
            const timeStr = `${hour.toString().padStart(2,'0')}:${minute.toString().padStart(2,'0')}`;
            deepTimeDisplay.innerText = `农历${currentDate}日 ${timeStr}`;

            const sunAngleDeg = (sunAngle * 180 / Math.PI + 360) % 360;
            const moonAngleDeg = (moonAngle * 180 / Math.PI + 360) % 360;
            deepSunPos.innerText = sunAngleDeg < 45 ? '东北' : (sunAngleDeg < 135 ? '北' : (sunAngleDeg < 225 ? '西北' : (sunAngleDeg < 315 ? '南' : '东南')));
            deepMoonPos.innerText = moonAngleDeg < 45 ? '东北' : (moonAngleDeg < 135 ? '北' : (moonAngleDeg < 225 ? '西北' : (moonAngleDeg < 315 ? '南' : '东南')));
            let diff = ((moonAngle - sunAngle) * 180 / Math.PI + 360) % 360;
            if (diff > 180) diff = 360 - diff;
            deepAngle.innerText = diff.toFixed(1) + '°';
        }

        function setupDeepControls() {
            deepDateSlider.addEventListener('input', function() {
                currentDate = parseInt(this.value);
                timeOfDay = 0;
                deepTimeSlider.value = 0;
                updateDeepPosition();
            });
            deepTimeSlider.addEventListener('input', function() {
                timeOfDay = parseInt(this.value) / 24;
                updateDeepPosition();
            });
            deepPrevBtn.addEventListener('click', function() {
                currentDate = currentDate > 1 ? currentDate - 1 : 30;
                deepDateSlider.value = currentDate;
                timeOfDay = 0; deepTimeSlider.value = 0;
                updateDeepPosition();
            });
            deepNextBtn.addEventListener('click', function() {
                currentDate = currentDate < 30 ? currentDate + 1 : 1;
                deepDateSlider.value = currentDate;
                timeOfDay = 0; deepTimeSlider.value = 0;
                updateDeepPosition();
            });
            deepPlayBtn.addEventListener('click', function() {
                isPlaying = !isPlaying;
                this.textContent = isPlaying ? '暂停' : '播放';
            });
            deepResetBtn.addEventListener('click', function() {
                currentDate = 1; timeOfDay = 0;
                deepDateSlider.value = 1; deepTimeSlider.value = 0;
                updateDeepPosition();
            });
            deepSpeedControl.addEventListener('input', function() {
                animationSpeed = parseInt(this.value);
            });
        }

        function onResizeDeep() {
            camera.aspect = canvasContainer.clientWidth / canvasContainer.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
        }

        function animateDeep() {
            requestAnimationFrame(animateDeep);
            controls.update();
            if (isPlaying) {
                timeOfDay += 0.0006 * animationSpeed;
                if (timeOfDay >= 1) {
                    timeOfDay = 0;
                    currentDate = currentDate < 30 ? currentDate + 1 : 1;
                    deepDateSlider.value = currentDate;
                }
                updateDeepPosition();
            }
            renderer.render(scene, camera);
        }

        initDeep();
    })();
</script>
